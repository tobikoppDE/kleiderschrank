<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kleiderschrank">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kleiderschrank</title>
<style>
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --tile:#E0E4DC; --ink:#161B18; --muted:#5C675F; --line:#D2D7CF;
  --accent:#2F5D50; --on-accent:#FFFFFF; --danger:#B42318; --cut-shadow:rgba(22,27,24,.30);
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tabh:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --surface:#1A1E1B; --tile:#252A26; --ink:#EDF0EA; --muted:#9AA59D; --line:#2C332E;
    --accent:#9CC5B3; --on-accent:#10201A; --danger:#FF8A7D; --cut-shadow:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --tile:#252A26; --ink:#EDF0EA; --muted:#9AA59D; --line:#2C332E;
  --accent:#9CC5B3; --on-accent:#10201A; --danger:#FF8A7D; --cut-shadow:rgba(0,0,0,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.42 var(--sans);touch-action:manipulation;min-height:100%}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Seitenkopf */
.page{max-width:900px;margin:0 auto;padding:0 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.title{margin:0;font:600 31px/1.1 var(--serif);letter-spacing:-.012em}
.pill-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px 0 14px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600}
.pill-btn:active{transform:scale(.97)}
.pill-btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.btag{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;border:1px solid var(--line)}
.packwrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.packwrap .packrow{flex:1;min-width:0;border-bottom:0}
.qty{display:flex;gap:6px;flex:none}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.qty button[disabled]{opacity:.4}

/* Suche + Chips */
.search{position:relative;margin:2px 0 12px}
.search input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 44px 0 42px;font-size:16px}
.search .ico{position:absolute;left:12px;top:12px;color:var(--muted)}
.search .clear{position:absolute;right:2px;top:1px;width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ghost{border-style:dashed;background:transparent;color:var(--muted)}
.chip .x{opacity:.7;margin-right:-4px}

/* Raster und Kacheln */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:block;width:100%;min-width:0;padding:0;border:0;background:none;text-align:left}
.tile-img{position:relative;display:grid;place-items:center;aspect-ratio:4/5;background:var(--tile);border-radius:16px;overflow:hidden}
.tile-img img{display:block}
.tile-img img.cut{max-width:90%;max-height:90%;object-fit:contain;filter:drop-shadow(0 7px 7px var(--cut-shadow))}
.tile-img img.photo{width:100%;height:100%;object-fit:contain}
.tile-name{display:block;margin-top:7px;font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-sub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.sel .tile-img{box-shadow:0 0 0 3px var(--accent)}
.badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.tilebox{position:relative;min-width:0}
.tilebox .rm{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.tilebox .rm span{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.cover{position:relative;display:grid;place-items:center;aspect-ratio:3/4;background:var(--tile);border-radius:16px;overflow:hidden}
.cover img.photo{width:100%;height:100%;object-fit:cover}
.mosaic{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:10px}
.mosaic div{display:grid;place-items:center;min-height:0;min-width:0}
.mosaic img{max-width:100%;max-height:100%;object-fit:contain}
.mosaic img.cut{filter:drop-shadow(0 4px 4px var(--cut-shadow))}
.mosaic img.photo{width:100%;height:100%;object-fit:contain;border-radius:8px}
.noimg{color:var(--muted);text-align:center;padding:16px;font-size:14px}

.tile.sel .cover{box-shadow:0 0 0 3px var(--accent)}
/* Reisen */
.card-btn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 12px}
.card-btn:active{transform:scale(.99)}
.trip-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trip-name{display:block;font:600 19px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{display:block;color:var(--muted);font-size:14px}
.thumbs{display:flex;gap:6px;margin-top:10px;align-items:center}
.thumbs .mini{width:40px;height:52px;border-radius:9px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.thumbs .mini img{width:100%;height:100%;object-fit:cover}
.thumbs .more{color:var(--muted);font-size:13px;padding-left:2px}
.status{display:inline-block;margin-top:10px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--tile)}
.status.warn{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.datepair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
input[type=date].input{min-width:0;-webkit-appearance:none;appearance:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{flex:none;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper button[disabled]{opacity:.4}
.stepper input{width:84px;min-height:52px;text-align:center;font:600 24px var(--serif);border:1px solid var(--line);border-radius:14px;background:var(--surface);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dimg{flex:none;width:46px;height:61px;border-radius:10px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.dimg img{width:100%;height:100%;object-fit:cover}
.dtxt{flex:1;min-width:0;text-align:left}
.dtxt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtxt small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daycard{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 10px 10px;margin:0 0 12px}
.daycard.empty{border-style:dashed;background:transparent}
.lchips{margin:2px 0 8px 58px}
.tierrow{margin:0 0 4px}
.tierrow .chips{margin-bottom:6px}
.tierlabel{display:block;font-size:13px;color:var(--muted);margin:6px 0 4px}
.shoeline{display:block;margin:2px 0 0;font-size:13px;color:var(--muted)}
.shoeline.warn{color:var(--accent);font-weight:600}
.statusrow{display:flex;flex-wrap:wrap;gap:6px}
.statusrow .status{margin-right:0}
.grid.wrapsub .tile-sub{white-space:normal}
.phototiles{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0;scrollbar-width:none}
.phototiles::-webkit-scrollbar{display:none}
.ptile{flex:none;width:92px;border:0;background:none;padding:0;text-align:left}
.ptile .pimg2{display:grid;place-items:center;width:92px;height:122px;border-radius:12px;background:var(--tile);overflow:hidden}
.ptile .pimg2 img{width:100%;height:100%;object-fit:cover}
.ptile .pimg2 img.item{object-fit:contain}
.ptile[aria-pressed="true"] .pimg2{box-shadow:0 0 0 3px var(--accent)}
.ptile b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.2;margin-top:5px}
.ptile small{display:block;color:var(--muted);font-size:12px}
.tierblock{display:grid;gap:8px;margin:0 0 18px}
.layerrow{width:100%;border:1px solid var(--line);background:var(--surface);margin:0 0 8px;border-radius:14px;padding:6px 10px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 0 6px 6px}
.dayhead b{font-size:15px}
.dayhead span{color:var(--muted);font-size:14px}
.orow{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.orow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:72px;padding:5px 6px;border:0;background:none;text-align:left;border-radius:12px}
button.orow-main:active{background:var(--tile)}
.rmbtn{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 12px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--accent);font-weight:600;text-align:left}
.grouphead{margin:20px 0 2px;font:600 15px var(--sans);color:var(--muted)}
.packrow{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:7px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.packrow .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent)}
.packrow .box svg{opacity:0}
.packrow[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.packrow[aria-checked="true"] .box svg{opacity:1}
.packrow[aria-checked="true"] .ptxt b{text-decoration:line-through;opacity:.55}
.packrow .pimg{flex:none;width:48px;height:60px;border-radius:10px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.packrow .pimg img.cut{max-width:90%;max-height:90%;object-fit:contain;filter:drop-shadow(0 3px 3px var(--cut-shadow))}
.packrow .pimg img.photo{width:100%;height:100%;object-fit:contain}
.packrow .ptxt{flex:1;min-width:0}
.packrow .ptxt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.packrow .ptxt small{display:block;color:var(--muted)}
.checkrow{display:flex;align-items:center;gap:12px;min-height:50px;margin:0 0 14px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.checkrow input{flex:none;width:22px;height:22px;accent-color:var(--accent)}

/* Leerzustand, Banner, Karten */
.empty{margin:48px auto;max-width:340px;text-align:center}
.empty h2{margin:0 0 8px;font:600 22px/1.2 var(--serif)}
.empty p{margin:0 0 20px;color:var(--muted)}
.banner{display:grid;gap:10px;margin:2px 0 14px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.banner p{margin:0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px}
.card h3{margin:0 0 4px;font:600 18px/1.25 var(--serif)}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.card p:last-child{margin-bottom:0}
.stack{display:grid;gap:10px}
.sec{margin:22px 0 10px;font:600 15px var(--sans);color:var(--muted);display:flex;align-items:center;justify-content:space-between}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);background:transparent}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.985)}
.row-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 4px;border:0;background:none;text-align:left}
.row-link small{color:var(--muted);font-size:14px}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:rise .2s ease-out}
.sheet:focus{outline:none}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.shead{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:minmax(80px,1fr) auto minmax(80px,1fr);align-items:center;gap:6px;padding:env(safe-area-inset-top,0px) 6px 0;min-height:calc(54px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.shead .stitle{margin:0;font:600 17px/1.2 var(--sans);text-align:center;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{min-height:44px;min-width:44px;padding:0 10px;border:0;background:none;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:2px;justify-self:start}
.tbtn.r{justify-self:end;font-weight:700}
.tbtn[disabled]{color:var(--muted);opacity:.7}
.sbody{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.sfoot{position:sticky;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.sfoot .inner{max-width:640px;margin:0 auto}
.sheet.modal{background:rgba(10,12,10,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mcard{width:min(100%,520px);max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
@media (min-width:640px){.sheet.modal{align-items:center}.mcard{border-radius:22px}}
.mcard h2{margin:0 0 6px;font:600 22px/1.2 var(--serif)}
.mcard p{margin:0 0 16px;color:var(--muted)}
.mcard .actions{display:grid;gap:10px;margin-top:18px}

/* Detail */
.hero{position:relative;display:grid;place-items:center;background:var(--tile);border-radius:22px;overflow:hidden;aspect-ratio:4/5;max-height:62vh;width:100%;margin:0 auto 16px}
.hero.portrait{aspect-ratio:3/4}
.hero img.cut{max-width:90%;max-height:90%;object-fit:contain;filter:drop-shadow(0 12px 12px var(--cut-shadow))}
.hero img.photo{width:100%;height:100%;object-fit:contain}
.hero canvas{max-width:90%;max-height:90%;display:block}
.hero canvas.cut{filter:drop-shadow(0 12px 12px var(--cut-shadow))}
.hero canvas.full{max-width:100%;max-height:100%}
.hero .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--tile);text-align:center;padding:16px}
.hero .wait[hidden]{display:none}
.h1{margin:0 0 4px;font:600 27px/1.15 var(--serif);letter-spacing:-.01em}
.meta{color:var(--muted);margin:0 0 6px}

/* Formulare */
.field{display:grid;gap:6px;margin:0 0 18px}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.field .hint{font-size:14px;color:var(--muted)}
.input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--tile);border-radius:13px;padding:3px;margin:0 0 14px}
.seg button{min-height:42px;border:0;border-radius:10px;background:none;font-weight:500}
.seg.compact button{font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.range{display:grid;gap:2px;margin:0 0 14px}
.range input{width:100%;height:44px;accent-color:var(--accent)}
.range .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.notice{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.notice[hidden]{display:none}
.tagbar{display:flex;gap:8px}
.tagbar .input{flex:1}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.iconpick button{aspect-ratio:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:24px;line-height:1}
.iconpick button[aria-pressed="true"]{background:var(--tile);border-color:var(--ink);border-width:2px}

/* Tabs, Toast, Busy */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
.tab{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;min-height:var(--tabh);border:0;background:none;color:var(--muted);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:90;display:flex;align-items:center;gap:6px;max-width:min(92vw,460px);padding:6px 6px 6px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{min-height:44px;padding:0 12px;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}
.busy{position:fixed;inset:0;z-index:95;background:rgba(10,12,10,.55);display:grid;place-items:center;padding:24px}
.busy .box{background:var(--bg);border-radius:20px;padding:22px 24px;min-width:240px;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--tile);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.spin{width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--tile);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="view"></div>
<nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>
<noscript><p style="padding:24px">Diese App braucht JavaScript.</p></noscript>

<script>
(function(){
'use strict';

/* =====================================================================

  // Kante glätten: 1 px schrumpfen, dann weich ausblenden
  const er = new Float32Array(n);
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (bg[i]) continue;
    const l = x > 0 ? !bg[i - 1] : true, r = x < w - 1 ? !bg[i + 1] : true;
    const u = y > 0 ? !bg[i - w] : true, d = y < hgt - 1 ? !bg[i + w] : true;

  const soft = new Float32Array(n);
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= hgt) continue; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx < 0 || xx >= w) continue; s += er[yy * w + xx]; c++; } }

    if (a > 127) fg++;
    if (a > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }

  const { x0, y0, x1, y1 } = res.bbox;

  out.getContext('2d').drawImage(tmp, cx0, cy0, out.width, out.height, 0, 0, out.width, out.height);

}

}

function backupInfo(now) {
  now = now || new Date();
  const since = S.settings.lastBackupAt || 0, today = dayKey(now.getTime());
  const counts = {}; let total = 0;
  for (const it of S.items) if (it.createdAt > since) { const k = dayKey(it.createdAt); counts[k] = (counts[k] || 0) + 1; total++; }
  let due = false;
  for (const k of Object.keys(counts)) if (counts[k] >= 5 && (k < today || now.getHours() >= 20)) due = true;
  return { due, total };
}
function checkBackupBanner() {
  if (!S.ready) return;
  const today = dayKey(Date.now());
  if (S.ui.bannerOn) return;
  if (S.settings.promptDay === today) return;
  if (backupInfo().due) { S.ui.bannerOn = true; S.settings.promptDay = today; saveSettings(); renderRoot(); }
}
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) dlPromise = (async () => { try { if (window.claude && window.claude.use) return await window.claude.use('downloads'); } catch (e) {} return null; })();
  return dlPromise;
}
async function createBackup() {
  if (S.ui.busy) return false;
  S.ui.busy = true; showBusy('Backup wird erstellt …', true);
  try {
    const parts = ['{"format":"kleiderschrank-backup","version":1,"exportedAt":' + Date.now() + ',"categories":' + JSON.stringify(S.cats) + ',"items":['];
    let n = 0; const total = (S.items.length + S.outfits.length) || 1;
    for (let i = 0; i < S.items.length; i++) {
      const it = S.items[i], meta = Object.assign({}, it); delete meta.thumbOrig; delete meta.thumbCut;
      const b = await Store.get('photos', 'item:' + it.id + ':orig');
      meta.photo = b ? await blobToDataURL(b) : null;
      parts.push((i ? ',' : '') + JSON.stringify(meta));
      setBusy('Backup wird erstellt …', ++n / total);
    }
    parts.push('],"outfits":[');
    for (let i = 0; i < S.outfits.length; i++) {
      const o = S.outfits[i], meta = Object.assign({}, o); delete meta.thumb;
      const b = o.hasPhoto ? await Store.get('photos', 'outfit:' + o.id) : null;
      meta.photo = b ? await blobToDataURL(b) : null;
      meta.layers = [];
      for (const l of (o.layers || [])) {
        const lm = Object.assign({}, l); delete lm.thumb;
        const lb = l.hasPhoto ? await Store.get('photos', 'outfit:' + o.id + ':layer:' + l.id) : null;
        lm.photo = lb ? await blobToDataURL(lb) : null;
        meta.layers.push(lm);
      }
      parts.push((i ? ',' : '') + JSON.stringify(meta));
      setBusy('Backup wird erstellt …', ++n / total);
    }
    parts.push('],"trips":' + JSON.stringify(S.trips) + '}');
    const blob = new Blob(parts, { type: 'application/json' });
    const name = 'kleiderschrank-backup-' + dayKey(Date.now()) + '.json';
    hideBusy();
    let saved = false;
    const dl = await getDownloads();
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); saved = true; }
      catch (e) { if (e && e.code === 'declined') { toast('Backup nicht gesichert.'); return false; } }
    }
    if (!saved && navigator.canShare && navigator.share) {
      try {
        const file = new File([blob], name, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Kleiderschrank-Backup' }); saved = true; }
      } catch (e) { if (e && e.name === 'AbortError') { toast('Backup nicht gesichert.'); return false; } }
    }
    if (!saved) {
      const a = h('a', { href: URL.createObjectURL(blob), download: name, style: 'display:none' });
      document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      saved = true;
    }
    S.settings.lastBackupAt = Date.now(); S.ui.bannerOn = false;
    await saveSettings();
    refreshAll();
    toast('Backup gesichert.');
    return true;
  } catch (e) {
    console.error(e); hideBusy();
    toast('Das Backup konnte nicht erstellt werden.');
    return false;
  } finally { S.ui.busy = false; hideBusy(); }
}
async function restoreFromFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Diese Datei ist kein gültiges Backup.'); return; }
  if (!data || data.format !== 'kleiderschrank-backup' || !Array.isArray(data.items) || !Array.isArray(data.outfits)) { toast('Diese Datei ist kein Kleiderschrank-Backup.'); return; }
  if (data.version > 1) { toast('Das Backup stammt aus einer neueren Version der App.'); return; }
  const ok = await confirmDialog({
    title: 'Backup einspielen?',
    body: data.items.length + ' Teile und ' + data.outfits.length + ' Outfits' + (Array.isArray(data.trips) && data.trips.length ? ' und ' + data.trips.length + (data.trips.length === 1 ? ' Reise' : ' Reisen') : '') + ', gesichert ' + fmtWhen(data.exportedAt || Date.now()) + '. Vorhandene Einträge mit derselben Kennung werden aktualisiert, alles andere bleibt erhalten.',
    confirmLabel: 'Einspielen'
  });
  if (!ok) return;
  S.ui.busy = true; showBusy('Backup wird eingespielt …', true);
  try {
    const fresh = S.items.length === 0 && S.outfits.length === 0;
    let cats = fresh ? [] : S.cats.slice();
    for (const c of (data.categories || [])) { if (c && c.id && c.name) { const i = cats.findIndex(x => x.id === c.id); if (i >= 0) cats[i] = c; else cats.push(c); } }
    if (!cats.length) cats = S.cats;
    S.cats = cats;
    const total = (data.items.length + data.outfits.length) || 1; let n = 0, skipped = 0;
    for (const m of data.items) {
      setBusy('Backup wird eingespielt … ' + (n + 1) + ' von ' + total, n / total);
      await wait(0);
      const blob = m.photo ? dataURLToBlob(m.photo) : null;
      if (!m.id || (!blob && !m.basic)) { skipped++; n++; continue; }
      if (!blob) {
        const recB = { id: m.id, name: m.name || 'Basic', categoryId: m.categoryId || null, createdAt: m.createdAt || Date.now(), useCutout: false, strength: 50, hasCut: false, thumbOrig: '', thumbCut: null, basic: true };
        S.items = upsert(S.items, recB); await Store.put('items', recB.id, recB); n++; continue;
      }
      try {
        const proc = await processPhoto(blob);
        const strength = typeof m.strength === 'number' ? m.strength : 50;
        const cr = (m.hasCut || m.useCutout) ? cutFrom(proc, strength) : { canvas: null };
        const rec = {
          id: m.id, name: m.name || 'Teil', categoryId: m.categoryId || null, createdAt: m.createdAt || Date.now(),
          useCutout: !!(m.useCutout && cr.canvas), strength, hasCut: !!cr.canvas,
          thumbOrig: scaleCanvas(proc.cOrig, 360).toDataURL('image/jpeg', .82),
          thumbCut: cr.canvas ? scaleCanvas(cr.canvas, 360).toDataURL('image/png') : null,
          basic: !!m.basic
        };
        await Store.put('photos', 'item:' + rec.id + ':orig', blob);
        if (cr.canvas) await Store.put('photos', 'item:' + rec.id + ':cut', await toBlob(cr.canvas, 'image/png'));
        else await Store.del('photos', 'item:' + rec.id + ':cut');
        dropPhotoURL('item:' + rec.id + ':orig'); dropPhotoURL('item:' + rec.id + ':cut');
        S.items = upsert(S.items, rec);
        await Store.put('items', rec.id, rec);
      } catch (e) { console.error(e); skipped++; }
      n++;
    }
    for (const m of data.outfits) {
      setBusy('Backup wird eingespielt … ' + (n + 1) + ' von ' + total, n / total);
      await wait(0);
      if (!m.id) { skipped++; n++; continue; }
      try {
        let thumb = null, hasPhoto = false;
        if (m.photo) {
          const blob = dataURLToBlob(m.photo);
          if (blob) {
            const cv = await blobToCanvas(blob, 1400);
            thumb = coverCanvas(cv, 360, 480).toDataURL('image/jpeg', .82); hasPhoto = true;
            await Store.put('photos', 'outfit:' + m.id, blob); dropPhotoURL('outfit:' + m.id);
          }
        }
        const layers = [];
        for (const lm of (Array.isArray(m.layers) ? m.layers : [])) {
          if (!lm || !lm.id) continue;
          let lthumb = null, lhas = false;
          if (lm.photo) {
            const lb = dataURLToBlob(lm.photo);
            if (lb) {
              const lcv = await blobToCanvas(lb, 1400);
              lthumb = coverCanvas(lcv, 360, 480).toDataURL('image/jpeg', .82); lhas = true;
              await Store.put('photos', 'outfit:' + m.id + ':layer:' + lm.id, lb); dropPhotoURL('outfit:' + m.id + ':layer:' + lm.id);
            }
          }
          layers.push({ id: lm.id, name: lm.name || '', tier: lm.tier === 1 ? 1 : 0, itemIds: Array.isArray(lm.itemIds) ? lm.itemIds : [], hasPhoto: lhas, thumb: lthumb });
        }
        const rec = { id: m.id, name: m.name || 'Outfit', tags: Array.isArray(m.tags) ? m.tags : [], itemIds: Array.isArray(m.itemIds) ? m.itemIds : [], createdAt: m.createdAt || Date.now(), thumb, hasPhoto, layers, tierNames: Array.isArray(m.tierNames) ? [String(m.tierNames[0] || ''), String(m.tierNames[1] || '')] : ['', ''], shoeIds: Array.isArray(m.shoeIds) ? m.shoeIds.filter(x => typeof x === 'string') : [] };
        S.outfits = upsert(S.outfits, rec);
        await Store.put('outfits', rec.id, rec);
      } catch (e) { console.error(e); skipped++; }
      n++;
    }
    for (const m of (Array.isArray(data.trips) ? data.trips : [])) {
      if (!m || !m.id) continue;
      try { const rec = normTrip(m); S.trips = upsert(S.trips, rec); await Store.put('trips', rec.id, rec); } catch (e) { console.error(e); skipped++; }
    }
    await persist(() => Store.put('meta', 'cats', S.cats));
    hideBusy(); refreshAll();
    toast(skipped ? 'Eingespielt, ' + skipped + (skipped === 1 ? ' Eintrag' : ' Einträge') + ' übersprungen.' : 'Backup eingespielt.');
  } catch (e) { console.error(e); hideBusy(); toast('Das Backup konnte nicht eingespielt werden.'); }
  finally { S.ui.busy = false; hideBusy(); }
}

/* ---------- Outfits ---------- */
function allTags() {
  const m = new Map();
  S.outfits.forEach(o => o.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'de')).map(e => e[0]);
}
function filteredOutfits() {
  const q = S.ui.oq.trim().toLowerCase();
  return S.outfits.filter(o => S.ui.tags.every(t => o.tags.includes(t)) && (!q || o.name.toLowerCase().includes(q) || o.tags.some(t => t.toLowerCase().includes(q))));
}
function outfitCover(o) {

// Galerie: ohne Zusatzschicht, oder jede Variante einer Zusatzschicht als eigene Kachel
function galleryEntries(view = S.ui.view, qRaw = S.ui.oq, tagList = S.ui.tags, pred = null) {
  const q = qRaw.trim().toLowerCase();
  const outfitHit = o => !q || o.name.toLowerCase().includes(q) || o.tags.some(t => t.toLowerCase().includes(q));
  const layerHit = (o, l) => !!q && layerLabel(o, l).toLowerCase().includes(q);
  const entries = []; let hidden = 0;
  S.outfits.filter(o => tagList.every(t => o.tags.includes(t)) && (!pred || pred(o))).forEach(o => {
    const oh = outfitHit(o), anyHit = oh || (o.layers || []).some(l => layerHit(o, l));
    if (view === null) { if (anyHit) entries.push({ o, layer: null }); return; }
    const ls = (o.layers || []).filter(l => l.tier === view);
    if (!ls.length) { if (anyHit) hidden++; return; }
    ls.forEach(l => { if (oh || layerHit(o, l)) entries.push({ o, layer: l }); });
  });
  return { entries, hidden };
}

    const draw = () => {
      const o = getOutfit(id);
      if (!o) { ctl.close(); return; }
      const layers = o.layers || [];
      const vars = [0, 1].map(t => layers.find(l => l.id === sel[t] && l.tier === t) || null);
      sel = vars.map(v => v ? v.id : null);
      clear(root);
      const chosen = vars.filter(Boolean), outer = chosen[chosen.length - 1] || null, pv = photoLayer(vars);
      const hero = h('div', { class: 'hero portrait' });
      if (pv) {
        const img = h('img', { src: pv.thumb, alt: 'Foto: ' + o.name + ', ' + layerLabel(o, pv), class: 'photo' });

      } else if (o.hasPhoto) {
        const img = h('img', { src: o.thumb, alt: 'Foto: ' + o.name, class: 'photo' });

      let note = null;
      if (chosen.length && !pv) note = 'Für diese Auswahl gibt es kein eigenes Foto. Gezeigt wird das Outfit ohne Zusatzschicht.';
      else if (pv && outer && pv.id !== outer.id) note = 'Die äußere Zusatzschicht hat kein eigenes Foto. Gezeigt wird das Foto von „' + layerLabel(o, pv) + '“.';
      const its = o.itemIds.map(x => getItem(x)).filter(Boolean);
      const shoes = (o.shoeIds || []).map(x => getItem(x)).filter(Boolean);

      });
      root.append(
        shead(o.name, backBtn(ctl), textBtn('Bearbeiten', () => openOutfitEdit({ id }), true)),
        h('div', { class: 'sbody' },
          h('div', null, tierRows),
          hero,

          h('h1', { class: 'h1' }, o.name),
          o.tags.length ? h('div', { class: 'chips wrap', style: 'margin-top:8px' }, o.tags.map(t => h('span', { class: 'chip' }, t))) : null,
          h('div', { class: 'sec' }, h('span', null, 'Teile in diesem Outfit (' + its.length + ')')),
          its.length ? h('div', { class: 'grid three' }, its.map(it => itemTile(it, { noSub: true, onClick: () => openItemDetail(it.id) }))) : h('p', { class: 'meta' }, 'Keine Teile ausgewählt. Tippe oben auf „Bearbeiten“, um Teile hinzuzufügen.'),

/* =====================================================================
   Teil anlegen / bearbeiten
   ===================================================================== */
function openItemEdit(opts) {
  const existing = opts.id ? getItem(opts.id) : null;
  if (opts.id && !existing) return;
  if (existing && existing.basic) { openBasicEdit(opts); return; }
  const draft = {
    name: existing ? existing.name : '',
    categoryId: existing ? existing.categoryId : (getCat(S.settings.lastCat) ? S.settings.lastCat : (S.cats[0] ? S.cats[0].id : null)),
    mode: existing ? (existing.useCutout ? 'cut' : 'orig') : 'orig',
    strength: existing ? existing.strength : 50,
    newPhoto: !existing
  };
  const initial = JSON.stringify([draft.name, draft.categoryId, draft.mode, draft.strength]);
  let proc = null, cutRes = null, ready = false, saving = false, notice = '';
  openSheet((root, ctl) => {
    const canvas = h('canvas', { 'aria-label': 'Vorschau des Fotos' });
    const waitEl = h('div', { class: 'wait' }, 'Foto wird vorbereitet …');
    const hero = h('div', { class: 'hero' }, canvas, waitEl);
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Darstellung' });
    const rangeBox = h('div', { class: 'range' });
    const noticeEl = h('div', { class: 'notice', role: 'status', hidden: true });
    const catBox = h('div', { class: 'chips wrap' });
    const saveBtn = h('button', { class: 'tbtn r', type: 'button', disabled: true, onclick: () => save() }, 'Sichern');
    const nameInp = h('input', { class: 'input', id: 'item-name', type: 'text', value: draft.name, placeholder: 'z. B. Blaues Leinenhemd', enterkeyhint: 'done', autocomplete: 'off', maxlength: '60' });
    nameInp.addEventListener('input', () => { draft.name = nameInp.value; });
    nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') nameInp.blur(); });

    const isDirty = () => JSON.stringify([draft.name, draft.categoryId, draft.mode, draft.strength]) !== initial || (existing && draft.newPhoto);
    ctl.guard = async () => {
      if (saving) return false;
      if (opts.rest && opts.rest.length) return confirmDialog({ title: 'Hinzufügen abbrechen?', body: 'Dieses Foto und die restlichen ' + opts.rest.length + (opts.rest.length === 1 ? ' Foto werden' : ' Fotos werden') + ' nicht übernommen.', confirmLabel: 'Abbrechen', cancelLabel: 'Weitermachen', danger: true });
      if (isDirty() && (existing || draft.name.trim())) return confirmDialog({ title: 'Änderungen verwerfen?', body: 'Deine Eingaben gehen verloren.', confirmLabel: 'Verwerfen', cancelLabel: 'Weiter bearbeiten', danger: true });
      return true;
    };
    const updateSave = () => { saveBtn.disabled = !ready || saving; saveBtn.textContent = saving ? 'Sichert …' : 'Sichern'; };

    const drawPreview = () => {
      if (!proc) return;
      const useCut = draft.mode === 'cut' && cutRes && cutRes.canvas;
      const src = useCut ? cutRes.canvas : proc.cOrig;
      canvas.width = src.width; canvas.height = src.height;
      const x = canvas.getContext('2d'); x.clearRect(0, 0, canvas.width, canvas.height); x.drawImage(src, 0, 0);
      canvas.className = useCut ? 'cut' : 'full';
    };
    // Freistellen ist eine bewusste Wahl pro Teil; gerechnet wird erst, wenn du es einschaltest
    const chooseCut = () => {
      if (!proc) return;
      if (!cutRes) cutRes = cutFrom(proc, draft.strength);
      if (!cutRes.canvas) { draft.mode = 'orig'; notice = 'Bei diesem Foto ließ sich der Hintergrund nicht entfernen. Das Original bleibt.'; }
      else { draft.mode = 'cut'; notice = cutRes.ok ? '' : 'Der Hintergrund ließ sich bei diesem Foto nicht sicher entfernen. Mit dem Regler kannst du nachbessern.'; }
      drawControls(); drawPreview();
    };
    const drawControls = () => {
      clear(seg); clear(rangeBox);
      seg.append(
        h('button', { type: 'button', 'aria-pressed': String(draft.mode === 'orig'), onclick: () => { draft.mode = 'orig'; notice = ''; drawControls(); drawPreview(); } }, 'Original'),
        h('button', { type: 'button', 'aria-pressed': String(draft.mode === 'cut'), onclick: () => chooseCut() }, 'Freigestellt'));
      if (draft.mode === 'cut') {
        const inp = h('input', { type: 'range', min: '0', max: '100', step: '1', value: String(draft.strength), 'aria-label': 'Freistell-Stärke' });
        let t = 0;
        inp.addEventListener('input', () => { draft.strength = Number(inp.value); clearTimeout(t); t = setTimeout(() => { if (proc) { cutRes = cutFrom(proc, draft.strength); drawPreview(); } }, 90); });
        rangeBox.append(h('span', { style: 'font-weight:600;font-size:15px' }, 'Freistell-Stärke'), inp,
          h('div', { class: 'ends' }, h('span', null, 'weniger entfernen'), h('span', null, 'mehr entfernen')),
          h('p', { class: 'meta', style: 'font-size:14px;margin:4px 0 0' }, 'Bleiben Reste vom Hintergrund stehen, schiebe den Regler nach rechts. Fehlen Teile des Kleidungsstücks, nach links.'));
      }
